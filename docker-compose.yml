services:
  # ============================================================================
  # FastAPI Backend (ML Scoring, SHAP XAI, EDA & Talk-to-Data NL-to-SQL)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: credit-risk-backend
    restart: unless-stopped
    # Port 8000 is intentionally NOT exposed on the host.
    # The frontend Nginx container reaches the backend via the internal
    # credit-risk-net Docker network (http://backend:8000/).
    # Only port 3000 (frontend) should be exposed externally.
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - DATABASE_PATH=data/credit_risk_analytics.db
      - FEATURE_STORE_PATH=data/model_features.db
    volumes:
      # Mount processed analytics database and inference feature store in read-only mode
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - credit-risk-net

  # ============================================================================
  # React + Vite Frontend (Nginx Production Reverse-Proxy & Static Asset Server)
  # ============================================================================
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      network: host
    container_name: credit-risk-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - credit-risk-net

networks:
  credit-risk-net:
    driver: bridge
